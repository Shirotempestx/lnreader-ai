name: Build Custom APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Rolled back to Expo's preferred LTS version

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Install Dependencies
        run: pnpm install

      - name: Generate Env Files
        run: pnpm run generate:env:debug || true

      - name: Expo Prebuild (Generates Android folder)
        run: npx expo prebuild --platform android

      - name: Compile Debug APK
        env:
          NODE_OPTIONS: '--max-old-space-size=8192' # Forces Node to use maximum available runner memory
        run: cd android && ./gradlew assembleDebug --stacktrace # Stacktrace will reveal exact JS errors

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: my-ai-reader-apk
          path: android/app/build/outputs/apk/debug/*.apk
